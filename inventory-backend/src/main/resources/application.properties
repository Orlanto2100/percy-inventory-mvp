spring.application.name=percy-inventory-mvp

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_mvp
spring.datasource.username=postgres
spring.datasource.password=new_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=change-this-to-a-long-random-secret-key-for-development-only-123456789
jwt.expiration=86400000